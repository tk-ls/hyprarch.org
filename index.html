<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>willslist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --text: #f5f5f7;
            --text-muted: #86868b;
            --accent: #2997ff;
            --surface: #1d1d1f;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            line-height: 1.47059;
            letter-spacing: -0.022em;
        }

        /* ─── HERO SECTION ─── */
        .hero {
            height: 70vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            background: linear-gradient(180deg, #000 0%, #111 100%);
        }

        .hero-title {
            font-size: clamp(48px, 10vw, 80px);
            font-weight: 700;
            letter-spacing: -0.015em;
            margin-bottom: 10px;
            background: linear-gradient(180deg, #fff 0%, #a1a1a6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-sub {
            font-size: clamp(21px, 3vw, 28px);
            font-weight: 500;
            color: var(--text-muted);
            max-width: 600px;
            margin-bottom: 30px;
        }

        .btn-primary {
            font-size: 17px;
            font-weight: 600;
            color: #fff;
            background: var(--accent);
            padding: 12px 24px;
            border-radius: 980px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background: #0077ed;
            transform: scale(1.05);
        }

        /* ─── LINKS SECTION ─── */
        .links-section {
            padding: 80px 20px;
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }

        .links-grid {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 30px;
            list-style: none;
        }

        .links-grid a {
            font-size: 17px;
            font-weight: 500;
            color: var(--accent);
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .links-grid a:hover {
            text-decoration: underline;
            opacity: 0.8;
        }

        footer {
            padding: 60px 20px;
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
            border-top: 1px solid #424245;
            max-width: 980px;
            margin: 0 auto;
        }

        @media (max-width: 734px) {
            .hero { height: 60vh; }
        }
    </style>
</head>
<body>

    <section class="hero">
        <h1 class="hero-title">willslist</h1>
        <p class="hero-sub">You're likely here to help. Or just looking around.</p>
        <a href="/form" class="btn-primary">Take the Survey</a>
    </section>

    <main class="links-section">
        <ul class="links-grid">
            <li><a href="https://files.hyprarch.org">files.hyprarch.org</a></li>
            <li><a href="https://git.hyprarch.org">git.hyprarch.org</a></li>
            <li><a href="https://code.hyprarch.org">code.hyprarch.org</a></li>
        </ul>
    </main>

    <footer>
        <p>Copyright &copy; 2026 willslist. All rights reserved.</p>
    </footer>

</body>
</html>
