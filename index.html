<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>willslist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --text: #f5f5f7;
            --text-muted: #86868b;
            --accent: #2997ff;
            --surface: #1d1d1f;
            --border: #424245;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            line-height: 1.47059;
            letter-spacing: -0.022em;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ─── HERO SECTION ─── */
        .hero {
            padding-top: 120px;
            padding-bottom: 60px;
            text-align: center;
        }

        .hero-title {
            font-size: clamp(48px, 10vw, 80px);
            font-weight: 700;
            letter-spacing: -0.015em;
            margin-bottom: 10px;
            background: linear-gradient(180deg, #fff 0%, #a1a1a6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-sub {
            font-size: clamp(21px, 3vw, 28px);
            font-weight: 500;
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto;
        }

        /* ─── BENTO GRID ─── */
        .grid-container {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Squircle common styles */
        .squircle {
            background: var(--surface);
            border-radius: 36px; /* Squircle look */
            text-decoration: none;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 17px;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.3s ease;
            border: 1px solid transparent;
        }

        .squircle:hover {
            transform: scale(1.02);
            background: #2c2c2e;
            border-color: var(--border);
        }

        /* Long Rectangle (Survey) */
        .survey-rect {
            width: 100%;
            height: 100px;
            font-size: 21px;
            letter-spacing: -0.01em;
        }

        /* Bottom Row */
        .bottom-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            height: 160px;
        }

        .bottom-row .squircle {
            flex-direction: column;
            padding: 20px;
            text-align: center;
            font-size: 15px;
        }

        .icon {
            font-size: 32px;
            margin-bottom: 12px;
        }

        footer {
            margin-top: auto;
            padding: 60px 20px;
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
            border-top: 1px solid #424245;
        }

        @media (max-width: 734px) {
            .bottom-row {
                grid-template-columns: 1fr;
                height: auto;
            }
            .bottom-row .squircle {
                height: 120px;
            }
        }
    </style>
</head>
<body>

    <section class="hero">
        <h1 class="hero-title">willslist</h1>
        <p class="hero-sub">Likely here to help. Or just looking around.</p>
    </section>

    <div class="grid-container">
        <!-- Survey Rectangle -->
        <a href="/form" class="squircle survey-rect">
            Entrepreneurship Project Survey
        </a>

        <!-- Trio Row -->
        <div class="bottom-row">
            <a href="https://files.hyprarch.org" class="squircle">
                <span class="icon">📂</span>
                File Browser
            </a>
            <a href="https://git.hyprarch.org" class="squircle">
                <span class="icon">🐙</span>
                Gitea
            </a>
            <a href="https://code.hyprarch.org" class="squircle">
                <span class="icon">💻</span>
                Code Server
            </a>
        </div>
    </div>

    <footer>
        <p>Copyright &copy; 2026 willslist. All rights reserved.</p>
    </footer>

</body>
</html>
