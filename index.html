<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>willslist</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #1d1d1f;
            --link-color: #0066cc;
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-stack);
            display: flex;
            justify-content: center;
            padding-top: 100px;
            margin: 0;
            line-height: 1.5;
        }

        .container {
            max-width: 600px;
            width: 90%;
        }

        h1 {
            font-size: 32px;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 40px;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            margin-bottom: 16px;
        }

        a {
            color: var(--link-color);
            text-decoration: none;
            font-size: 20px;
            font-weight: 400;
            transition: opacity 0.2s;
        }

        a:hover {
            opacity: 0.7;
        }

        footer {
            margin-top: 80px;
            font-size: 12px;
            color: #86868b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>willslist</h1>
        <ul>
            <li><a href="https://files.hyprarch.org">files.hyprarch.org</a></li>
            <li><a href="https://git.hyprarch.org">git.hyprarch.org</a></li>
            <li><a href="https://code.hyprarch.org">code.hyprarch.org</a></li>
            <li><a href="/form">survey</a></li>
        </ul>
        <footer>&copy; 2026 willslist</footer>
    </div>
</body>
</html>
